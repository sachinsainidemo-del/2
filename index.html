<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter</title>

<style>
body{
    margin:0;
    padding:0;
    background:#fff0f5;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
}

#intro{
    position:fixed;
    inset:0;
    background:black;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:30px;
    transition:opacity 1.5s ease;
}

#intro.hide{
    opacity:0;
    pointer-events:none;
}

.container{
    max-width:700px;
    margin:80px auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #ccc;
    margin-top:20px;
    font-size:20px;
    text-align:center;
}

.hidden{
    display:none;
}

h1{
    text-align:center;
}

.fade{
    opacity:0;
    transform:translateY(20px);
    transition:1s;
}

.fade.show{
    opacity:1;
    transform:translateY(0);
}
</style>
</head>

<body>

<div id="intro">
    Opening Memories...
</div>

<div class="container fade" id="box">
    <h1>I Never Meant To Hurt You</h1>

    <p>
        Read it slowly, feel every word.
    </p>

    <input type="password" id="pass" placeholder="Enter Password">

    <div id="content" class="hidden">
        <p style="margin-top:30px;">
            Hey Sonam 🌸
        </p>

        <p>
            This is the final gift from my side...
        </p>
    </div>
</div>

<script>
setTimeout(()=>{
    document.getElementById("intro").classList.add("hide");
    document.getElementById("box").classList.add("show");
},2000);

document.getElementById("pass").addEventListener("input",function(){
    if(this.value==="1803"){
        document.getElementById("content").classList.remove("hidden");
    }
});
</script>

</body>
</html>
